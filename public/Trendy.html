<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHION & BEAUTY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<header class="container-fluid">
    <nav class="menu w-100">
        <h1 style="text-align: center">FASHION & BEAUTY</h1>
            <ul class="d-flex justify-content-center gap-3">
            <li><a href="index.html#glowna">HOME</a></li>
            <li><a href="oMnie.html#oMnie">O MNIE</a></li>
            <li><a href="Zestawy.html">ZESTAWY</a></li>
            <li>TRENDY</li>
        </ul>
    </nav>
</header>

<main class="container mt-5">

    <section id="galeria">
        <h1 style="text-align: center">Galeria Trendów</h1>

        <h2>Panterka</h2>
        <div class="d-flex justify-content-center align-items-center">
                <button onclick="previousImageLeopard()" class="btn btn-secondary btn-circle me-3">❮</button>
                <img id="galleryImageLeopard" src="https://i.pinimg.com/564x/98/05/dc/9805dc1312831b0224138bfa9f1f03c0.jpg" alt="Galeria obrazków" class="img-fluid" style="max-width: 300px; height: auto;">
                <button onclick="nextImageLeopard()" class="btn btn-secondary btn-circle ms-3">❯</button>
        </div>

        <h2>Buty UGG</h2>
        <div class="d-flex justify-content-center align-items-center">
            <button onclick="previousImageBoots()" class="btn btn-secondary btn-circle me-3">❮</button>
            <img id="galleryImageBoots" src="https://i.pinimg.com/736x/f9/c1/3f/f9c13f5952c63c280052436ac8ca11cf.jpg" alt="Galeria obrazków" class="img-fluid" style="max-width: 300px; height: auto;">
            <button onclick="nextImageBoots()" class="btn btn-secondary btn-circle ms-3">❯</button>
        </div>

        <h2>Złoto i srebro razem</h2>
        <div class="d-flex justify-content-center align-items-center">
            <button onclick="previousImageGS()" class="btn btn-secondary btn-circle me-3">❮</button>
            <img id="galleryImageGS" src="https://i.pinimg.com/736x/5e/63/1b/5e631b7422d52735138d9960d84be5d0.jpg" alt="Galeria obrazków" class="img-fluid" style="max-width: 300px; height: auto;">
            <button onclick="nextImageGS()" class="btn btn-secondary btn-circle ms-3">❯</button>
        </div>

    </section>

    <section id="comments" class="mb-5">
        <h4 style="text-align: center">Podziel się swoją opinią na temat trendów! Zostaw komentarz!</h4>
        <div class="mb-3">
            <input type="text" id="commentContent" class="form-control" placeholder="Wpisz treść komentarza">
            <div class="text-center mt-2">
            <button onclick="addComment()" class="comButton">Dodaj</button>
        </div>
        <ul id="commentList" class="list-group"></ul>
    </section>

</main>

<script>
    function addComment() {
        const commentContent = document.getElementById("commentContent").value;
        if (commentContent.trim() === "") return;

        const commentList = document.getElementById("commentList");
        const listItem = document.createElement("li");
        listItem.className = "list-group-item d-flex justify-content-between align-items-center";
        listItem.innerHTML = `
            ${commentContent}
            <button onclick="removeComment(this)" class="btn btn-danger btn-sm">Usuń</button>
        `;
        commentList.appendChild(listItem);
        document.getElementById("commentContent").value = "";
    }

    function removeComment(button) {
        const listItem = button.parentElement;
        listItem.remove();
    }


    const images1 = [
        "https://i.pinimg.com/564x/98/05/dc/9805dc1312831b0224138bfa9f1f03c0.jpg",
        "https://i.pinimg.com/564x/39/7a/48/397a48eaa5a8fefeecfaac5b4a29b8e7.jpg",
        "https://i.pinimg.com/736x/d7/d5/ff/d7d5ffea479d738c27fd8aac425d7c32.jpg"
        ];

    const images2 = [
        "https://i.pinimg.com/736x/f9/c1/3f/f9c13f5952c63c280052436ac8ca11cf.jpg",
        "https://i.pinimg.com/736x/2b/a9/f7/2ba9f750a75f3eaf70207b59fa7b36f9.jpg",
        "https://i.pinimg.com/736x/af/77/76/af777665f1f69cff1d5736d50a0ce849.jpg"
        ];

    const images3 = [
        "https://i.pinimg.com/736x/5e/63/1b/5e631b7422d52735138d9960d84be5d0.jpg",
        "https://i.pinimg.com/736x/07/f7/60/07f7609a865caaab0f5457a61670d7b6.jpg",
        "https://i.pinimg.com/736x/5f/25/71/5f2571a03d16f4e168c9215ecd802c20.jpg"
    ];

    let currentIndex1 = 0;
    let currentIndex2 = 0;
    let currentIndex3 = 0;


    function updateGalleryImageLeopard() {
        const galleryImageLeopard = document.getElementById("galleryImageLeopard");
        galleryImageLeopard.src = images1[currentIndex1];
    }
    function nextImageLeopard() {
        currentIndex1 = (currentIndex1 + 1) % images1.length;
        updateGalleryImageLeopard();
    }
    function previousImageLeopard() {
        currentIndex1 = (currentIndex1 - 1 + images1.length) % images1.length;
        updateGalleryImageLeopard();
    }

    function updateGalleryImageBoots() {
        const galleryImageBoots = document.getElementById("galleryImageBoots");
        galleryImageBoots.src = images2[currentIndex2];
    }
    function nextImageBoots() {
        currentIndex2 = (currentIndex2 + 1) % images2.length;
        updateGalleryImageBoots();
    }
    function previousImageBoots() {
        currentIndex2 = (currentIndex2 - 1 + images2.length) % images2.length;
        updateGalleryImageBoots();
    }

    function updateGalleryImageGS () {
        const galleryImageGS = document.getElementById("galleryImageGS");
        galleryImageGS.src = images3[currentIndex3];
    }
    function nextImageGS () {
        currentIndex3 = (currentIndex3 + 1) % images3.length;
        updateGalleryImageGS();
    }
    function previousImageGS () {
        currentIndex3 = (currentIndex3 - 1 + images3.length) % images3.length;
        updateGalleryImageGS();
    }
</script>


<footer class="container-fluid text-center">
    <nav class="w-100">
        <p class="info">© 2023 Fashion & Beauty. Wszelkie prawa zastrzeżone.</p>
    </nav>
</footer>
</body>
</html>
