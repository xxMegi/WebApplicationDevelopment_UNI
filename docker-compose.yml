services:
  app:
    build: .
    container_name: fashion_app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: fashion_user
      DB_PASSWORD: fashion_pass
      DB_NAME: fashion_beauty
      SESSION_SECRET: docker_session_secret
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: fashion_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fashion_beauty
      MYSQL_USER: fashion_user
      MYSQL_PASSWORD: fashion_pass
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufashion_user", "-pfashion_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: